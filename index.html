<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X STORE | Premium Experience</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

        :root {
            --gold: #FFD700;
            --primary-red: #ff0033; /* لون أحمر براند X */
            --bg-black: #000;
            --smoke-white: rgba(255, 255, 255, 0.15);
            --glass: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-black); font-family: 'Orbitron', sans-serif;
            color: white; overflow-x: hidden; scroll-behavior: smooth;
            cursor: none; /* لإخفاء الماوس الأصلي واستبداله بالمخصص */
        }

        /* --- Custom Cursor --- */
        #custom-cursor {
            position: fixed; width: 20px; height: 20px; border: 2px solid white;
            border-radius: 50%; pointer-events: none; z-index: 9999;
            transition: transform 0.1s ease, background 0.3s ease;
            mix-blend-mode: difference;
        }

        #starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: 0.6; }

        .page {
            position: relative; z-index: 10; width: 100%; min-height: 100vh;
            display: none; flex-direction: column; align-items: center; padding: 40px 20px;
            box-sizing: border-box;
        }

        .active { display: flex; animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Header & Cart Icon --- */
        .top-nav {
            position: fixed; top: 0; width: 100%; padding: 20px 5%;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100; pointer-events: none;
        }
        .nav-icon { 
            pointer-events: auto; cursor: pointer; background: var(--glass);
            padding: 12px; border-radius: 50%; border: 1px solid var(--border-glass);
            transition: 0.3s;
        }
        .nav-icon:hover { background: white; color: black; box-shadow: 0 0 20px white; }

        /* --- الواجهة الرئيسية --- */
        .splash-content { justify-content: center; height: 100vh; gap: 50px; }
        .store-name { font-size: 2.5rem; font-weight: 900; letter-spacing: 15px; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
        .main-menu { display: flex; flex-direction: column; gap: 20px; }
        .menu-item { 
            font-size: 1.2rem; letter-spacing: 5px; cursor: pointer; opacity: 0.5; 
            transition: 0.4s; position: relative; padding: 10px;
        }
        .menu-item::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background: white; transition: 0.3s; }
        .menu-item:hover { opacity: 1; text-shadow: 0 0 15px white; }
        .menu-item:hover::after { width: 100%; }

        /* --- شبكة المنتجات --- */
        .products-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 30px; width: 100%; max-width: 1200px; margin-top: 60px; 
        }
        .product-card {
            background: var(--glass); border-radius: 20px; padding: 25px; transition: 0.5s; cursor: pointer; text-align: center;
            border: 1px solid var(--border-glass); backdrop-filter: blur(10px); overflow: hidden;
        }
        .product-card:hover { 
            border-color: var(--primary-red); transform: translateY(-15px); 
            box-shadow: 0 20px 40px rgba(255, 0, 51, 0.15); 
        }
        .img-box { 
            width: 100%; aspect-ratio: 1/1; object-fit: contain; 
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5)); transition: 0.5s; 
        }
        .product-card:hover .img-box { transform: scale(1.1); filter: drop-shadow(0 0 25px var(--primary-red)); }

        /* --- Cart Sidebar --- */
        #cartSidebar {
            position: fixed; right: -400px; top: 0; width: 350px; height: 100%;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); z-index: 1000;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); padding: 40px 20px;
            border-left: 1px solid var(--border-glass);
        }
        #cartSidebar.open { right: 0; }
        .cart-title { font-size: 1.5rem; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .cart-item { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .cart-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }

        /* نفس تنسيقات الدخان وتفاصيل المنتج الأصلية مع تحسين البوردرات */
        .detail-info { background: rgba(10, 10, 10, 0.8); border: 1px solid var(--border-glass); }
        .btn-buy { background: var(--primary-red); color: white; text-transform: uppercase; }
        .btn-buy:hover { background: #ff3366; box-shadow: 0 0 30px var(--primary-red); }

        /* Social bar animation */
        .social-link:hover { transform: translateY(-5px); }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>
    <canvas id="starfield"></canvas>

    <div class="top-nav">
        <div class="nav-icon" onclick="navigateTo('splashPage')"><i style="font-style: normal;">X</i></div>
        <div class="nav-icon" onclick="toggleCart()">CART (<span id="cartCount">0</span>)</div>
    </div>

    <div id="splashPage" class="page splash-content active">
        <div style="text-align: center;">
            <svg width="150" height="150" viewBox="0 0 200 200" id="logoContainer" style="cursor: grab;">
                <g id="logo-mesh" stroke="white" stroke-width="12" fill="none" style="filter: drop-shadow(0 0 15px white);">
                    <path d="M50,150 L150,50" /><path d="M150,150 L50,50" />
                </g>
            </svg>
            <div class="store-name">X STORE</div>
        </div>
        <nav class="main-menu">
            <div class="menu-item" onclick="navigateTo('catalogPage')">01. COLLECTIONS</div>
            <div class="menu-item" onclick="navigateTo('catalogPage')">02. SHOP ALL</div>
            <div class="menu-item">03. ARCHIVE</div>
        </nav>
        <div class="footer-bar">
            <div class="social-bar" style="display:flex; gap:30px;">
                <a href="https://www.instagram.com/xce____7oda__x" target="_blank" class="social-link"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" width="20" style="filter: invert(1);"></a>
                <a href="https://www.tiktok.com/@628..2" target="_blank" class="social-link"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" width="20" style="filter: invert(1);"></a>
            </div>
        </div>
    </div>

    <div id="catalogPage" class="page">
        <div class="store-name" style="font-size: 1.2rem; margin-top: 50px;">LATEST DROPS</div>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <div id="productDetailPage" class="page">
        <div class="smoke-container">
            <div class="smoke-blob sb-1"></div><div class="smoke-blob sb-2"></div><div class="smoke-blob sb-3"></div>
        </div>
        <div class="back-link" onclick="history.back()" style="margin-top: 60px;">[ ESCAPE ]</div>
        <div class="detail-container" id="productDetailContent"></div>
    </div>

    <div id="cartSidebar">
        <div class="cart-title">YOUR ARCHIVE</div>
        <div id="cartItemsList"></div>
        <div style="margin-top: 30px; border-top: 1px solid #333; padding-top: 20px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <span>TOTAL:</span>
                <span id="cartTotal">0.00</span> EGP
            </div>
            <button class="btn-buy" style="width:100%" onclick="checkoutCart()">CHECKOUT (WA)</button>
            <button class="btn-cart" style="width:100%; margin-top:10px;" onclick="toggleCart()">CLOSE</button>
        </div>
    </div>

    <script>
        // --- 1. بيانات المنتجات (نفس بياناتك مع روابط الصور) ---
        const products = [
            { id: 1, name: "UNIVERSITY HOODIE", price: 999, img: "Picsart_26-02-14_16-25-30-082.png" },
            { id: 2, name: "RASPBERRY SWEAT", price: 850, img: "Picsart_26-02-14_16-25-05-041.png" },
            { id: 3, name: "NY BLACK EDITION", price: 999, img: "Picsart_26-02-14_16-24-39-633.png" },
            { id: 4, name: "AMAZING OVERSIZE", price: 750, img: "Picsart_26-02-13_22-03-08-041.png" }
        ];

        let cart = [];
        const whatsappNumber = "201000000000";

        // --- 2. نظام الماوس المخصص ---
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
        document.querySelectorAll('button, .menu-item, .product-card, .nav-icon').forEach(item => {
            item.addEventListener('mouseenter', () => cursor.style.transform = 'scale(3)');
            item.addEventListener('mouseleave', () => cursor.style.transform = 'scale(1)');
        });

        // --- 3. نظام السلة ---
        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('open');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCartUI();
            alert(`${product.name} ADDED TO ARCHIVE`);
        }

        function updateCartUI() {
            const list = document.getElementById('cartItemsList');
            const count = document.getElementById('cartCount');
            const total = document.getElementById('cartTotal');
            list.innerHTML = '';
            let sum = 0;
            
            cart.forEach((item, index) => {
                sum += item.price;
                list.innerHTML += `
                    <div class="cart-item">
                        <img src="${item.img}" onerror="this.src='https://placehold.co/100'">
                        <div>
                            <div style="font-size:0.8rem">${item.name}</div>
                            <div style="color:var(--primary-red)">${item.price} EGP</div>
                        </div>
                    </div>`;
            });
            count.innerText = cart.length;
            total.innerText = sum.toFixed(2);
        }

        function checkoutCart() {
            if(cart.length === 0) return alert("CART IS EMPTY");
            let itemsText = cart.map(i => `- ${i.name} (${i.price} EGP)`).join('%0A');
            let total = document.getElementById('cartTotal').innerText;
            window.open(`https://wa.me/${whatsappNumber}?text=New Order from X STORE:%0A${itemsText}%0A%0ATotal: ${total} EGP`, '_blank');
        }

        // --- 4. إدارة التنقل (نفس كودك مع تحسينات) ---
        function navigateTo(pageId) {
            history.pushState({page: pageId}, "", "#" + pageId);
            renderPage(pageId);
        }

        function renderPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            if(pageId === 'splashPage') toggleCart(false);
            window.scrollTo(0,0);
        }

        window.onpopstate = (e) => e.state && renderPage(e.state.page);

        // --- 5. بناء المنتجات ---
        const grid = document.getElementById('productsGrid');
        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.onclick = () => openProduct(p);
            card.innerHTML = `
                <img src="${p.img}" class="img-box" onerror="this.src='https://placehold.co/400x400/111/444?text=Product'">
                <div style="margin-top:20px; font-weight:bold; letter-spacing:2px;">${p.name}</div>
                <div style="color:var(--primary-red); margin-top:10px;">EGP ${p.price}</div>
            `;
            grid.appendChild(card);
        });

        function openProduct(product) {
            const detailBox = document.getElementById('productDetailContent');
            detailBox.innerHTML = `
                <img src="${product.img}" class="detail-img" onerror="this.src='https://placehold.co/600'">
                <div class="detail-info">
                    <h1 style="letter-spacing:5px; color:white;">${product.name}</h1>
                    <div class="price-tag" style="color:var(--primary-red)">${product.price} EGP</div>
                    <p style="color:#888; line-height:1.6; font-family:'Rajdhani'">PREMIUM STREETWEAR FABRIC. HANDCRAFTED DESIGN FOR THE X ARCHIVE. LIMITED EDITION DROP.</p>
                    <div class="size-selector">
                        <div class="size-btn" onclick="selectSize(this)">S</div>
                        <div class="size-btn selected" onclick="selectSize(this)">M</div>
                        <div class="size-btn" onclick="selectSize(this)">L</div>
                    </div>
                    <div class="action-btns" style="margin-top:20px;">
                        <button class="btn-buy" onclick="addToCart(${product.id})">ADD TO ARCHIVE</button>
                    </div>
                </div>`;
            navigateTo('productDetailPage');
        }

        // --- 6. تأثيرات النجوم واللوجو (نفس كودك الأصلي) ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function initStars() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            stars = [];
            for(let i=0; i<400; i++) stars.push({ x: Math.random()*canvas.width-canvas.width/2, y: Math.random()*canvas.height-canvas.height/2, z: Math.random()*canvas.width, o: Math.random() });
        }
        function drawStars() {
            ctx.fillStyle = "black"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            for(let s of stars) {
                s.z -= 2; if (s.z <= 0) s.z = canvas.width;
                let x = (s.x / s.z) * canvas.width + canvas.width/2;
                let y = (s.y / s.z) * canvas.height + canvas.height/2;
                let r = (1 - s.z/canvas.width) * 1.5;
                ctx.beginPath(); ctx.fillStyle = `rgba(255, 255, 255, ${s.o})`; ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
            }
            requestAnimationFrame(drawStars);
        }
        initStars(); drawStars();

        // Logo 3D Effect
        const container = document.getElementById('logoContainer');
        const mesh = document.getElementById('logo-mesh');
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;
            mesh.style.transform = `rotateY(${x * 100}deg) rotateX(${y * -100}deg)`;
        });
        container.addEventListener('mouseleave', () => mesh.style.transform = `rotate(0)`);
    </script>
</body>
</html>
